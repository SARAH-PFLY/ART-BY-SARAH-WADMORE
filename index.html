<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art by Sarah Wadmore — Artwork Gallery</title>
<meta name="description" content="Explore the artwork gallery of Sarah Wadmore. Tap an artwork to take a closer look.">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:-5px}
header{height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#000;color:#fff}h1{font-size:18px;letter-spacing:-.6px;margin:0}h1 small{display:block;text-transform:uppercase;font-size:9px;letter-spacing:2.7px;margin-bottom:5px}header p{font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
#wall{position:relative;width:100%}
.tile{position:absolute;display:block;padding:0;border:0;overflow:hidden;background:transparent;min-width:0}
.tile img,.tile video{width:100%;height:auto;object-fit:contain;object-position:center;display:block}.caption{position:absolute;inset:auto 0 0;padding:40px 18px 17px;text-align:left;background:transparent;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .2s;font-size:12px}.tile:hover .caption,.tile:focus-visible .caption{opacity:1}.demo{position:absolute;top:12px;left:12px;background:#0008;padding:5px 7px;font-size:9px;letter-spacing:1px}
footer{padding:22px 28px;background:#000;color:#aaa;font-size:11px;display:flex;justify-content:space-between;gap:20px}
dialog{position:fixed;inset:0;width:100%;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:#000;color:#fff}dialog::backdrop{background:#000}.viewer{height:100%;display:flex;align-items:center;justify-content:center;padding:68px 70px 80px}.viewer img,.viewer video{width:100%;height:100%;object-fit:contain;user-select:none}.controls{position:absolute;top:16px;right:16px;display:flex;gap:8px}.control{background:#222c;border:1px solid #666;border-radius:50%;width:44px;height:44px;font-size:24px}.prev,.next{position:absolute;top:calc(50% - 22px)}.prev{left:14px}.next{right:14px}#detail{position:absolute;bottom:20px;left:24px;right:24px;text-align:center;font-size:12px;line-height:1.7}#detail span{display:block;color:#aaa;font-size:11px}
@media(max-width:650px){header{height:65px;padding:0 16px}h1{font-size:15px}header p{font-size:9px;letter-spacing:.5px}.viewer{padding:76px 12px 105px}.prev,.next{top:auto;bottom:18px}.caption{display:none}footer{padding:20px 16px;flex-direction:column;gap:8px}.demo{font-size:8px;left:8px;top:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}.play-badge{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);background:#0009;border:1px solid #fff8;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;pointer-events:none}.tile video{pointer-events:none}
header nav{display:flex;align-items:center;gap:24px;font-size:12px}.about-link{color:#fff;text-decoration:none;letter-spacing:1.5px}.about-link:focus-visible{outline:2px solid #fff;outline-offset:5px}@media(max-width:650px){header nav{gap:14px;font-size:11px}}.blog-menu{position:relative}.blog-menu summary{cursor:pointer;list-style:none;letter-spacing:1.5px;padding:14px 0}.blog-menu summary:after{content:'⌄';margin-left:8px}.blog-menu[open]>div{display:block}.blog-menu>div{position:absolute;right:0;top:100%;z-index:20;background:#000;color:#fff;width:min(330px,85vw);box-shadow:0 12px 35px #0002;border:1px solid #deded6;padding:12px}.blog-menu>div a{display:block;padding:13px;text-decoration:none;line-height:1.4}.blog-menu>div a:hover{background:#191919}
.skip-link{position:absolute;left:12px;top:-100px;z-index:100;background:#fff;color:#111;padding:12px}.skip-link:focus{top:8px}#gallery-status{padding:18px 28px;font-size:13px}#gallery-status:empty{display:none}#media-status{position:absolute;left:10%;right:10%;bottom:65px;text-align:center;font-size:12px;color:#ddd;pointer-events:none}.blog-menu>div a{color:#fff;overflow-wrap:anywhere}.blog-menu summary:focus-visible{outline:2px solid #fff;outline-offset:5px}.tile:focus-visible{outline:3px solid #fff;outline-offset:-6px}

/* Captions must never sit over the existing arrow hit areas. */
#detail{pointer-events:none}#lightbox .viewer{position:relative;z-index:0;min-height:0}
#lightbox .controls{z-index:5}#lightbox .prev,#lightbox .next{z-index:6;pointer-events:auto;touch-action:manipulation}
#lightbox .control{touch-action:manipulation;-webkit-tap-highlight-color:transparent}


#share-panel{inset:0;margin:auto;width:min(520px,calc(100vw - 28px));height:auto;max-height:calc(100dvh - 40px);padding:28px;border:1px solid #ffffff20;border-radius:24px;overflow:auto;background:radial-gradient(ellipse at 12% 0%,#ffffff09,transparent 60%),linear-gradient(150deg,#1a1a1d,#101012 70%);color:#f4f3ef;box-shadow:0 36px 100px #000b,0 8px 24px #0008,inset 0 1px #ffffff12;color-scheme:dark;scrollbar-width:thin;scrollbar-color:#444 transparent}
#share-panel::backdrop{background:#000a;backdrop-filter:blur(9px)}
#share-panel .share-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
#share-panel .share-eyebrow{margin:0 0 8px;font-size:9px;letter-spacing:2.5px;color:#b7b1a3}
#share-panel h2{font-size:25px;font-weight:500;letter-spacing:-.8px;margin:0;line-height:1.2}
#share-panel #dismiss-share{flex:0 0 32px;width:32px;height:32px;padding:0;background:#ffffff07;color:#aaa;border:1px solid #ffffff12;border-radius:50%;font-size:21px}
#share-panel label{display:block;margin:18px 0 9px;color:#b3b1ad;font-size:11px;letter-spacing:.4px}
#share-panel select{width:100%;padding:12px 14px;border:1px solid #ffffff15;border-radius:12px;background:#ffffff05;color:#eee;font:inherit;font-size:14px}
#share-panel select option{background:#18181b;color:#fff}
#share-panel textarea{display:block;width:100%;height:176px;max-height:30dvh;min-height:90px;padding:15px;border:1px solid #ffffff12;border-radius:14px;background:#09090b80;box-shadow:inset 0 2px 8px #0004;color:#deddd8;font:inherit;font-size:13px;line-height:1.65;resize:vertical}
#share-panel textarea:focus,#share-panel select:focus{outline:0;border-color:#b8aa8870;box-shadow:0 0 0 3px #b8aa8810}
#share-panel #share-count{margin:8px 2px 16px;font-size:10px;color:#8f8d87;text-align:right}
#share-panel .share-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#share-panel .share-actions button,#share-panel .share-actions a{display:flex;justify-content:center;align-items:center;min-height:44px;padding:12px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff04;color:#deddd8;font:inherit;font-size:12px;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
#share-panel .share-actions #open-social{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(120deg,#e7dfcc,#faf8f0 55%,#d8cfba);border-color:#eee2c5;color:#25221b;font-weight:600;box-shadow:0 5px 18px #0004,inset 0 1px #fff;animation:share-glow 3s ease-in-out 3}
#share-panel #open-social::after{content:'';position:absolute;inset:-100% auto -100% -70%;width:35%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:rotate(25deg);pointer-events:none;animation:share-shine 5s ease-in-out 3}
#share-panel .share-actions button:hover,#share-panel .share-actions a:hover{transform:translateY(-1px);border-color:#ffffff40;background-color:#ffffff0c}
#share-panel .share-actions .share-quiet{min-height:32px;border:0;background:transparent;color:#93918b;font-size:11px}
#share-panel a[aria-disabled=true]{opacity:.4;animation:none!important}
#share-panel .share-trust{display:flex;align-items:center;justify-content:center;gap:7px;margin:18px 0 0;color:#96958f;font-size:10px}
#share-panel .share-trust svg{width:12px;height:12px;color:#b3bda8}
#share-panel .share-info{margin-top:15px;border-top:1px solid #ffffff0b;padding-top:13px}
#share-panel .share-info summary{cursor:pointer;text-align:center;font-size:10px;color:#aaa59b;list-style:none}
#share-panel .share-info summary::after{content:' +'}
#share-panel .share-info[open] summary::after{content:' −'}
#share-panel #share-help{font-size:11px;line-height:1.65;color:#99978f;margin:12px 0 0}
#share-panel #share-feedback{font-size:11px;line-height:1.5;color:#d6d0c0;margin:12px 0 0;text-align:center}
#share-panel #share-feedback:empty{display:none}
#share-panel :focus-visible{outline:2px solid #d0c3a4;outline-offset:3px}
@keyframes share-glow{0%,100%{box-shadow:0 5px 18px #0004,0 0 0 #e7dfcc00}50%{box-shadow:0 5px 18px #0004,0 0 20px #e7dfcc20}}
@keyframes share-shine{0%,60%{left:-70%}100%{left:150%}}
@media(max-width:480px){#share-panel{padding:22px;border-radius:20px;max-height:calc(100dvh - 24px)}#share-panel h2{font-size:23px}}
@media(prefers-reduced-motion:reduce){#share-panel *,#share-panel *::after{animation:none!important;transition:none!important}}

<body><a class="skip-link" href="#wall">Skip to artworks</a>
<header><h1><small>Art by</small>Sarah Wadmore</h1><nav aria-label="Main navigation"><a class="about-link" href="/about/">ABOUT</a><details class="blog-menu"><summary>BLOG</summary><div data-blog-links><a href="/blog/">View all posts →</a></div></details></nav></header>
<p id="gallery-status" role="status" aria-live="polite">Loading artworks…</p><noscript><p style="padding:20px">Enable JavaScript to explore the interactive artwork wall. You can also <a href="/blog/">read the journal</a>.</p></noscript><main id="wall" aria-label="Artwork gallery"></main>
<footer><span>© <span id="year"></span> Sarah Wadmore</span><span id="note">Demo tiles · Original artworks coming soon</span></footer>
<dialog id="lightbox" aria-label="Artwork viewer"><div class="viewer"><img id="full" alt=""><video id="full-video" controls playsinline preload="metadata" hidden></video></div><div class="controls"><button class="control" id="share" aria-label="Share artwork">↗</button><button class="control" id="expand" aria-label="Enter device fullscreen">⛶</button><button class="control" id="close" aria-label="Close artwork viewer">×</button></div><button class="control prev" id="prev" aria-label="Previous artwork">‹</button><button class="control next" id="next" aria-label="Next artwork">›</button><p id="media-status" role="status" aria-live="polite"></p><div id="detail"></div></dialog>
<script>
'use strict';
const wall=document.querySelector('#wall'),box=document.querySelector('#lightbox'),full=document.querySelector('#full'),detail=document.querySelector('#detail');
const fullVideo=document.querySelector('#full-video');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function isVideo(work){return work.type==='video'||/\.mp4(?:[?#]|$)/i.test(work.src)}
function stopVideo(){fullVideo.pause();fullVideo.removeAttribute('src');fullVideo.load();fullVideo.hidden=true}
function syncPreviews(){
 document.querySelectorAll('.tile video[data-preview]').forEach(video=>{
 const visible=video.dataset.visible==='true';
 if(visible&&!reducedMotion.matches&&!box.open&&!document.hidden)video.play().catch(()=>{});else video.pause();
 });
}
reducedMotion.addEventListener('change',syncPreviews);
document.addEventListener('visibilitychange',syncPreviews);
let works=[],current=0,opener=null,startX=0,startY=0;

const galleryStatus=document.querySelector('#gallery-status'),mediaStatus=document.querySelector('#media-status');
function wallLayout(heights,columns){
 const bottoms=Array(columns).fill(0);
 return heights.map(height=>{const column=bottoms.indexOf(Math.min(...bottoms)),top=bottoms[column];bottoms[column]+=height;return {column,top,height}});
}
function layoutWall(){
 const columns=Math.min(works.length,window.matchMedia('(max-width:650px)').matches?2:3);
 if(!columns){wall.style.height='0px';return}
 const tiles=Array.from(wall.querySelectorAll('.tile')),width=wall.clientWidth/columns;
 const heights=tiles.map(tile=>{const media=tile.querySelector('img,video');const w=media.naturalWidth||media.videoWidth||1,h=media.naturalHeight||media.videoHeight||1;return width*h/w});
 const layout=wallLayout(heights,columns);
 tiles.forEach((tile,index)=>{const item=layout[index];tile.style.width=width+'px';tile.style.height=item.height+'px';tile.style.left=item.column*width+'px';tile.style.top=item.top+'px'});
 wall.style.height=Math.max(0,...layout.map(item=>item.top+item.height))+'px';
}
window.addEventListener('resize',layoutWall);
function artworkKey(work){return work.uploadId||work.src}
function setArtworkURL(){const url=new URL(location.href);url.searchParams.set('art',artworkKey(works[current]));history.replaceState(null,'',url);window.__sarahRadio?.syncURL?.(url.href)}
function clearArtworkURL(){const url=new URL(location.href);url.searchParams.delete('art');history.replaceState(null,'',url);window.__sarahRadio?.syncURL?.(url.href)}

const sharePanel=document.createElement('dialog');
sharePanel.id='share-panel';
sharePanel.setAttribute('aria-labelledby','share-heading');
sharePanel.innerHTML="<div class=\"share-head\"><div><p class=\"share-eyebrow\">ART BY SARAH WADMORE</p><h2 id=\"share-heading\">Art worth sharing.</h2></div><button id=\"dismiss-share\" aria-label=\"Back to artwork\">×</button></div><label for=\"share-platform\">Share to</label><select id=\"share-platform\"><option value=\"x\">X</option><option value=\"facebook\">Facebook</option><option value=\"instagram\">Instagram</option><option value=\"tiktok\">TikTok</option></select><label for=\"share-caption\">Your caption · make it yours</label><textarea id=\"share-caption\" rows=\"5\"></textarea><p id=\"share-count\"></p><div class=\"share-actions\"><button id=\"copy-caption\">Copy caption</button><a id=\"open-social\" target=\"_blank\" rel=\"noopener noreferrer\">Continue</a><a class=\"share-quiet\" id=\"download-art\" download>↓ Save artwork</a><button class=\"share-quiet\" id=\"device-share\">More ways to share ↗</button></div><p class=\"share-trust\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"3\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/></svg>You choose what to post. Sign in on your platform.</p><details class=\"share-info\"><summary>How sharing works</summary><p id=\"share-help\"></p></details><p id=\"share-feedback\" role=\"status\" aria-live=\"polite\"></p>";
box.append(sharePanel);
const platformSelect=sharePanel.querySelector('#share-platform'),captionInput=sharePanel.querySelector('#share-caption'),shareFeedback=sharePanel.querySelector('#share-feedback');
let shareWork,shareURL;
function makeShareCaption(work,platform,url){
 const title=work.title.trim()||'Artwork by Sarah Wadmore';
 const medium=work.medium?'Medium / artist notes: '+work.medium+'\n\n':'';
 if(platform==='x'){
 // ASCII keeps the standard X weighted character budget predictable.
 const shortTitle=title.replace(/[^\x20-\x7E]/g,'').trim().slice(0,38)||'Explore the artwork';
 return shortTitle+' — Sarah Wadmore (PFLY / PU51FLY), Graffiti Kings artist and Crypto Moongirls creator. Discover her artwork, digital collections and creative world. #SarahWadmore #PFLY\n'+url;
 }
 const intro=platform==='instagram'?'Meet the artist behind the artwork.':platform==='tiktok'?'Art, characters and a creative world: meet Sarah PFLY.':'Discover Sarah Wadmore and the creative world behind her artwork.';
 return intro+'\n\n'+title+'\n\n'+medium+
 'Sarah Wadmore, also known as Sarah PFLY and Sarah PU51FLY, is an artist and creative consultant connected with Graffiti Kings, and the creator of Crypto Moongirls. Her practice brings together individual artworks, digital collections and character-led storytelling. This piece is part of her online gallery, where you can open each work for a closer look and explore more of her creative output.\n\n'+
 'Sarah’s work also has a place in the history of digital art exhibitions. She contributed to the Graffiti Queens exhibition in Decentraland in April 2021, including its promotional flyer, and was named among the artists in the Graffiti Kings-linked SYNC Network NFT exposition that month. Those connections sit alongside her own artwork and the creative identity she has developed as PFLY / PU51FLY.\n\n'+
 'Her digital work includes the Sarah PU51FLY collection on OpenSea and a collection on the WAX blockchain. She has also collaborated with Charlie Buster on “Dropping Bomb’s”. These are part of the wider picture of an artist working across personal expression, collaboration and digital ownership. Explore the About page for the background and source links.\n\n'+
 'There is a fictional side to this world too: Queen Sarah PFLY is a character in the Crypto Moonboys universe, connected with Crypto Moongirls and Block Topia. That character belongs to the project’s storytelling; Sarah Wadmore is the real artist behind the work. Her gallery and biography offer a starting point for exploring both, with the artwork at the centre.\n\n'+
 'Take a closer look at this piece, explore the rest of the gallery and discover more about Sarah’s art, collaborations and creative world. What catches your eye?\n\n'+
 'View this artwork: '+url+'\nAbout Sarah: https://sarahwadmore.com/about/\n\n#SarahWadmore #SarahPFLY #PU51FLY #GraffitiKings #CryptoMoongirls';
}
function shareLength(){
 if(platformSelect.value==='x'){
 const withoutURL=captionInput.value.replace(/https?:\/\/\S+/g,'xxxxxxxxxxxxxxxxxxxxxxx');
 return Array.from(withoutURL).reduce((n,c)=>n+(c.codePointAt(0)>4351?2:1),0);
 }
 return captionInput.value.length;
}
function updateShareLink(){
 const platform=platformSelect.value,limit=platform==='x'?280:platform==='instagram'?2200:platform==='tiktok'?2200:60000;
 const count=shareLength(),valid=count<=limit&&count>0;
 sharePanel.querySelector('#share-count').textContent=count+' / '+limit+' characters'+(platform==='tiktok'?' (caption kept within a conservative 2,200-character budget)':'')+(valid?'':' — shorten the caption to continue');
 const link=sharePanel.querySelector('#open-social');
 link.href=platform==='x'?'https://x.com/intent/tweet?'+new URLSearchParams({text:captionInput.value}):platform==='facebook'?'https://www.facebook.com/sharer/sharer.php?'+new URLSearchParams({u:shareURL}):platform==='instagram'?'https://www.instagram.com/':'https://www.tiktok.com/upload';
 link.textContent=platform==='x'?'Continue to X ↗':'Continue to '+platform[0].toUpperCase()+platform.slice(1)+' ↗';
 link.setAttribute('aria-disabled',String(!valid));
}
function selectSharePlatform(){
 captionInput.value=makeShareCaption(shareWork,platformSelect.value,shareURL);
 sharePanel.querySelector('#share-help').textContent=platformSelect.value==='x'?
 'X opens with your caption and artwork link. Sign in there if prompted. To attach the image itself, download it and add it to your post.':
 'Copy your caption, then open the platform and sign in if prompted. Paste the caption before posting. For Instagram or TikTok, download the artwork and upload it in the app or website. Captions and files cannot be automatically inserted through these website links.';
 shareFeedback.textContent='';updateShareLink();
}
platformSelect.onchange=selectSharePlatform;
captionInput.oninput=updateShareLink;
sharePanel.querySelector('#copy-caption').onclick=async()=>{
 try{await navigator.clipboard.writeText(captionInput.value);shareFeedback.textContent='Caption copied. Paste it into your social post.'}
 catch{captionInput.focus();captionInput.select();shareFeedback.textContent='Select and copy the caption above, then paste it into your social post.'}
};
sharePanel.querySelector('#open-social').onclick=event=>{if(event.currentTarget.getAttribute('aria-disabled')==='true')event.preventDefault()};
sharePanel.querySelector('#dismiss-share').onclick=()=>sharePanel.close();
sharePanel.addEventListener('close',()=>document.querySelector('#share').focus());
sharePanel.addEventListener('keydown',event=>event.stopPropagation());
sharePanel.addEventListener('touchstart',event=>event.stopPropagation(),{passive:true});
sharePanel.addEventListener('touchend',event=>event.stopPropagation(),{passive:true});
sharePanel.querySelector('#device-share').onclick=async()=>{
 if(!navigator.share){shareFeedback.textContent='Device sharing is unavailable. Copy the caption and open your chosen platform.';return}
 try{await navigator.share({title:shareWork.title,text:captionInput.value})}
 catch(error){if(error.name!=='AbortError')shareFeedback.textContent='Device sharing failed. Copy the caption and open your chosen platform.'}
};
document.querySelector('#share').onclick=()=>{
 shareWork=works[current];if(!shareWork)return;
 const url=new URL('/',location.origin);url.searchParams.set('art',artworkKey(shareWork));shareURL=url.href;
 const download=sharePanel.querySelector('#download-art');download.href=new URL(shareWork.src,location.href).href;
 download.download=shareWork.src.split('/').pop();selectSharePlatform();sharePanel.querySelector('.share-info').open=false;sharePanel.showModal();sharePanel.scrollTop=0;
};
full.addEventListener('load',()=>{mediaStatus.textContent=''});
full.addEventListener('error',()=>{if(!full.hidden)mediaStatus.textContent='This artwork could not load. Try the next artwork or reload the page.'});
fullVideo.addEventListener('loadeddata',()=>{mediaStatus.textContent=''});
fullVideo.addEventListener('error',()=>{if(!fullVideo.hidden)mediaStatus.textContent='This video could not play. Try another browser or reload the page.'});

function placeholder(index){
 const colors=[['#fa6d43','#392343','#e7afc0'],['#e1be37','#173e4b','#f3dfae'],['#183e8b','#ef705e','#c0d5df'],['#a9b399','#eacbc0','#274940'],['#c83e5a','#382754','#e7a648'],['#dfd5bf','#272724','#8b7569']];
 const c=colors[index%colors.length];
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100"><rect width="800" height="1100" fill="'+c[0]+'"/><path d="M-120 '+(250+index*13)+' Q450 -150 640 370 T260 1240 L-100 1100Z" fill="'+c[1]+'"/><ellipse cx="'+(280+index*19%300)+'" cy="560" rx="230" ry="350" fill="'+c[2]+'" transform="rotate(25 400 550)"/><path d="M50 900 Q700 200 760 800" fill="none" stroke="'+c[0]+'" stroke-width="65"/><path d="M100 100 L720 960" stroke="'+c[1]+'" stroke-width="7"/></svg>';
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function render(){
 works.forEach((work,index)=>{
 const button=document.createElement('button');button.className='tile';button.setAttribute('aria-label','Open '+work.title);
 let img;
 if(isVideo(work)){
 img=document.createElement('video');img.src=work.src;img.muted=true;img.playsInline=true;img.preload='metadata';img.setAttribute('aria-hidden','true');
 if(work.thumbnail)img.poster=work.thumbnail;
 {img.loop=true;const observer=new IntersectionObserver(entries=>{for(const entry of entries){img.dataset.visible=String(entry.isIntersecting);syncPreviews()}});observer.observe(img);img.dataset.preview='true'}
 const badge=document.createElement('span');badge.className='play-badge';badge.textContent='▶';badge.setAttribute('aria-hidden','true');button.append(badge);
 }else{img=document.createElement('img');img.src=work.thumbnail||work.src;img.alt=work.title;img.loading=index<3?'eager':'lazy';img.decoding='async'}

 img.addEventListener('load',layoutWall);img.addEventListener('loadedmetadata',layoutWall);img.addEventListener('error',layoutWall);
 const caption=document.createElement('span');caption.className='caption';caption.textContent=work.title+' ↗';button.append(img,caption);
 if(work.demo){const label=document.createElement('span');label.className='demo';label.textContent='DEMO TILE';button.append(label)}
 button.addEventListener('click',()=>{opener=button;document.querySelectorAll('.tile video').forEach(video=>video.pause());show(index);box.showModal();document.body.style.overflow='hidden';document.querySelector('#close').focus()});wall.append(button);
 });
 layoutWall();
}
function show(index){current=(index+works.length)%works.length;const work=works[current];setArtworkURL();mediaStatus.textContent='Loading artwork…';stopVideo();full.hidden=isVideo(work);if(isVideo(work)){full.removeAttribute('src');fullVideo.hidden=false;fullVideo.src=work.src;fullVideo.setAttribute('aria-label',work.title);fullVideo.loop=!!work.animated;fullVideo.muted=!!work.animated;fullVideo.load();if(work.animated&&!reducedMotion.matches)fullVideo.play().catch(()=>{})}else{full.src=work.src;full.alt=work.title}detail.replaceChildren(document.createTextNode(work.title));const meta=document.createElement('span');meta.textContent=(current+1)+' / '+works.length+(work.demo?' · Layout placeholder':work.medium?' · '+work.medium:'');detail.append(meta)}
async function closeViewer(){if(window.__sarahMiniApp)window.__sarahMiniApp.exitFullscreen();else if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen().catch(()=>{});box.close()}
document.querySelector('#close').onclick=closeViewer;
box.addEventListener('close',()=>{stopVideo();clearArtworkURL();document.body.style.overflow='';syncPreviews();opener?.focus()});
box.addEventListener('cancel',event=>{event.preventDefault();closeViewer()});
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);
box.addEventListener('keydown',event=>{if(event.target===fullVideo)return;if(event.key==='ArrowLeft'){event.preventDefault();show(current-1)}if(event.key==='ArrowRight'){event.preventDefault();show(current+1)}});
box.addEventListener('touchstart',event=>{if(event.target===fullVideo){startX=null;return}startX=event.changedTouches[0].clientX;startY=event.changedTouches[0].clientY},{passive:true});
box.addEventListener('touchend',event=>{if(startX===null||event.target===fullVideo)return;const dx=event.changedTouches[0].clientX-startX,dy=event.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1))},{passive:true});
const expand=document.querySelector('#expand');
if(!document.documentElement.requestFullscreen)expand.hidden=true;
expand.onclick=async()=>{if(window.__sarahMiniApp){window.__sarahMiniApp.toggleFullscreen();return}try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{mediaStatus.textContent='Fullscreen is not available in this browser.'}};
document.querySelector('#year').textContent=new Date().getFullYear();
async function init(){
 galleryStatus.textContent='Loading artworks…';
 try{
 const response=await fetch('./artworks.json',{cache:'no-cache'});if(!response.ok)throw Error('Gallery unavailable');
 const data=await response.json();if(!Array.isArray(data))throw Error('Invalid gallery');
 works=data.filter(w=>w&&typeof w.src==='string'&&typeof w.title==='string');wall.replaceChildren();
 galleryStatus.textContent=works.length?'':'No artworks to display yet.';
 document.querySelector('#note').textContent='Select an artwork to explore';
 if(works.length){
 render();
 const key=new URL(location.href).searchParams.get('art'),index=works.findIndex(work=>artworkKey(work)===key);
 if(key&&index>=0){opener=wall.querySelectorAll('.tile')[index];show(index);box.showModal();document.body.style.overflow='hidden';document.querySelector('#close').focus()}
 else if(key)galleryStatus.textContent='That artwork is no longer in the gallery. Explore the collection below.';
 }
 }catch{
 galleryStatus.replaceChildren(document.createTextNode('The gallery could not load. '));const retry=document.createElement('button');retry.textContent='Try again';retry.onclick=init;galleryStatus.append(retry);
 }
}
init();
</script></body></html>
