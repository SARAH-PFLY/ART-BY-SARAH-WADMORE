<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art by Sarah Wadmore — Artwork Gallery</title>
<meta name="description" content="Explore the artwork gallery of Sarah Wadmore. Tap an artwork to take a closer look.">
<style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:-5px}
header{height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#faf9f6;color:#181818}h1{font-size:18px;letter-spacing:-.6px;margin:0}h1 small{display:block;text-transform:uppercase;font-size:9px;letter-spacing:2.7px;margin-bottom:5px}header p{font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
#wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(110px,13vw,245px);grid-auto-flow:row dense;gap:0}
.tile{padding:0;border:0;position:relative;overflow:hidden;background:#333;min-width:0}.tile:nth-child(6n+1),.tile:nth-child(6n+4){grid-row:span 3}.tile:nth-child(6n+2),.tile:nth-child(6n+5){grid-row:span 2}.tile:nth-child(6n+3),.tile:nth-child(6n){grid-row:span 2}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.tile:hover img{transform:scale(1.035)}.caption{position:absolute;inset:auto 0 0;padding:40px 18px 17px;text-align:left;background:linear-gradient(transparent,#0009);opacity:0;transition:opacity .2s;font-size:12px}.tile:hover .caption,.tile:focus-visible .caption{opacity:1}.demo{position:absolute;top:12px;left:12px;background:#0008;padding:5px 7px;font-size:9px;letter-spacing:1px}
footer{padding:22px 28px;background:#faf9f6;color:#555;font-size:11px;display:flex;justify-content:space-between;gap:20px}
dialog{position:fixed;inset:0;width:100%;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:#0b0b0b;color:#fff}dialog::backdrop{background:#0b0b0b}.viewer{height:100%;display:flex;align-items:center;justify-content:center;padding:68px 70px 80px}.viewer img{width:100%;height:100%;object-fit:contain;user-select:none}.controls{position:absolute;top:16px;right:16px;display:flex;gap:8px}.control{background:#222c;border:1px solid #666;border-radius:50%;width:44px;height:44px;font-size:24px}.prev,.next{position:absolute;top:calc(50% - 22px)}.prev{left:14px}.next{right:14px}#detail{position:absolute;bottom:20px;left:24px;right:24px;text-align:center;font-size:12px;line-height:1.7}#detail span{display:block;color:#aaa;font-size:11px}
@media(max-width:650px){header{height:65px;padding:0 16px}h1{font-size:15px}header p{font-size:9px;letter-spacing:.5px}#wall{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:24vw}.viewer{padding:76px 12px 105px}.prev,.next{top:auto;bottom:18px}.caption{display:none}footer{padding:20px 16px;flex-direction:column;gap:8px}.demo{font-size:8px;left:8px;top:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header><h1><small>Art by</small>Sarah Wadmore</h1><p>A wall of artworks</p></header>
<main id="wall" aria-label="Artwork gallery"></main>
<footer><span>© <span id="year"></span> Sarah Wadmore</span><span id="note">Demo tiles · Original artworks coming soon</span></footer>
<dialog id="lightbox" aria-label="Artwork viewer"><div class="viewer"><img id="full" alt=""></div><div class="controls"><button class="control" id="expand" aria-label="Enter device fullscreen">⛶</button><button class="control" id="close" aria-label="Close artwork viewer">×</button></div><button class="control prev" id="prev" aria-label="Previous artwork">‹</button><button class="control next" id="next" aria-label="Next artwork">›</button><div id="detail"></div></dialog>
<script>
'use strict';
const wall=document.querySelector('#wall'),box=document.querySelector('#lightbox'),full=document.querySelector('#full'),detail=document.querySelector('#detail');
let works=[],current=0,opener=null,startX=0,startY=0;
function placeholder(index){
 const colors=[['#fa6d43','#392343','#e7afc0'],['#e1be37','#173e4b','#f3dfae'],['#183e8b','#ef705e','#c0d5df'],['#a9b399','#eacbc0','#274940'],['#c83e5a','#382754','#e7a648'],['#dfd5bf','#272724','#8b7569']];
 const c=colors[index%colors.length];
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100"><rect width="800" height="1100" fill="'+c[0]+'"/><path d="M-120 '+(250+index*13)+' Q450 -150 640 370 T260 1240 L-100 1100Z" fill="'+c[1]+'"/><ellipse cx="'+(280+index*19%300)+'" cy="560" rx="230" ry="350" fill="'+c[2]+'" transform="rotate(25 400 550)"/><path d="M50 900 Q700 200 760 800" fill="none" stroke="'+c[0]+'" stroke-width="65"/><path d="M100 100 L720 960" stroke="'+c[1]+'" stroke-width="7"/></svg>';
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function render(){
 works.forEach((work,index)=>{
 const button=document.createElement('button');button.className='tile';button.setAttribute('aria-label','Open '+work.title);
 const img=document.createElement('img');img.src=work.thumbnail||work.src;img.alt=work.title;img.loading=index<4?'eager':'lazy';img.decoding='async';
 const caption=document.createElement('span');caption.className='caption';caption.textContent=work.title+' ↗';button.append(img,caption);
 if(work.demo){const label=document.createElement('span');label.className='demo';label.textContent='DEMO TILE';button.append(label)}
 button.addEventListener('click',()=>{opener=button;show(index);box.showModal();document.body.style.overflow='hidden';document.querySelector('#close').focus()});wall.append(button);
 });
}
function show(index){current=(index+works.length)%works.length;const work=works[current];full.src=work.src;full.alt=work.title;detail.replaceChildren(document.createTextNode(work.title));const meta=document.createElement('span');meta.textContent=(current+1)+' / '+works.length+(work.demo?' · Layout placeholder':work.medium?' · '+work.medium:'');detail.append(meta)}
async function closeViewer(){if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen().catch(()=>{});box.close()}
document.querySelector('#close').onclick=closeViewer;
box.addEventListener('close',()=>{document.body.style.overflow='';opener?.focus()});
box.addEventListener('cancel',event=>{event.preventDefault();closeViewer()});
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);
box.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();show(current-1)}if(event.key==='ArrowRight'){event.preventDefault();show(current+1)}});
box.addEventListener('touchstart',event=>{startX=event.changedTouches[0].clientX;startY=event.changedTouches[0].clientY},{passive:true});
box.addEventListener('touchend',event=>{const dx=event.changedTouches[0].clientX-startX,dy=event.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1))},{passive:true});
const expand=document.querySelector('#expand');
if(!document.documentElement.requestFullscreen)expand.hidden=true;
expand.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{expand.hidden=true}};
document.querySelector('#year').textContent=new Date().getFullYear();
async function init(){try{const response=await fetch('./artworks.json');if(!response.ok)throw Error('Gallery unavailable');const data=await response.json();if(!Array.isArray(data))throw Error('Invalid gallery');works=data.filter(w=>w&&typeof w.src==='string'&&typeof w.title==='string')}catch(error){console.warn(error)}
 if(!works.length)works=Array.from({length:24},(_,i)=>({title:'Demo composition '+String(i+1).padStart(2,'0'),src:placeholder(i),demo:true}));else document.querySelector('#note').textContent='Select an artwork to explore';render()}
init();
</script></body></html>
